<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>https://elektrykplock.mobidziennik.pl/dziennik</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', system-ui, sans-serif;
      color: #222;
      /* Animowane gradientowe tło */
      background: linear-gradient(120deg, #d5b8ff 0%, #a7c5fd 100%);
      background-size: 200% 200%;
      animation: gradientMove 8s ease-in-out infinite alternate;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 60%; }
      100% { background-position: 100% 40%; }
    }
    .card {
      background: rgba(255,255,255,0.92);
      border-radius: 18px;
      box-shadow: 0 4px 30px 0 rgba(93,129,228,0.17);
      padding: 42px 26px 36px 26px;
      max-width: 390px;
      width: 94vw;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.7s cubic-bezier(0.7,0.1,0.3,1);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px);}
      to   { opacity: 1; transform: translateY(0);}
    }
    h1 {
      font-size: 2.2em;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 0.2em;
      color: #8241cb;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px #e0c7ff66;
      animation: popIn 1.1s cubic-bezier(0.7,0.1,0.3,1);
    }
    @keyframes popIn {
      0% { transform: scale(0.84);}
      60%{ transform: scale(1.06);}
      100%{ transform: scale(1);}
    }
    p {
      margin-top: 0.8em;
      margin-bottom: 1.4em;
      font-size: 1em;
      color: #444;
      line-height: 1.4;
    }
    .download-btn {
      display: inline-block;
      padding: 15px 38px;
      font-size: 1.09em;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, #6c47bb 45%, #6cd4ff 130%);
      border: none;
      border-radius: 100px;
      box-shadow: 0 2px 24px #8a54ca44;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      outline: none;
      font-family: inherit;
      margin-top: 12px;
      margin-bottom: 16px;
      animation: btnIn 1.2s cubic-bezier(0.8,0.1,0.2,1);
    }
    @keyframes btnIn {
      from { opacity: 0; transform: scale(0.88);}
      to   { opacity: 1; transform: scale(1);}
    }
    .download-btn:hover, .download-btn:focus {
      transform: scale(1.066);
      background: linear-gradient(90deg, #47c8bb 35%, #7fdede 135%);
      box-shadow: 0 8px 36px #47c8bb33;
    }
    .subtle {
      font-size: 0.98em;
      color: #8c7ac9;
      margin-top: 0.5em;
      margin-bottom: 1.5em;
    }
    footer {
      font-size: 0.86em;
      color: #888;
      margin-top: 32px;
      margin-bottom: -12px;
      letter-spacing: 0.2px;
      text-align: center;
      opacity: 0.95;
    }
    @media (max-width: 550px) {
      .card {
        padding: 26px 5vw;
        max-width: 97vw;
      }
      h1 { font-size: 1.38em; }
      .download-btn { font-size: 1em; padding: 12px 12vw;}
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>5 Night's at Konczal's</h1>
    <div class="subtle">Lekka jednostronowa gra. Pobierz i przetrwaj pięć legendarnych nocy!</div>
    <p>
      Atmosfera grozy, wyzwania i <b>Konczal</b> w najlepszym wydaniu.<br>
      Sprawdź, czy podołasz temu zadaniu!
    </p>
    <a 
      class="download-btn" 
      href="https://files.catbox.moe/tw44c0.zip" 
      download
    >
      ↓ Pobierz grę (ZIP)
    </a>
    <footer>
      &copy; 2025 | Five Night's At Konczal's 
    </footer>
  </div>
</body>
</html>
