<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5 Night's at Konczal's</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', system-ui, sans-serif;
      color: #f5f5f5;
      /* Animowany gradient w odcieniach czerni i czerwieni */
      background: linear-gradient(120deg, #2a0207 15%, #000 90%);
      background-size: 180% 180%;
      animation: gradientMove 8s ease-in-out infinite alternate;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 70%; }
      100% { background-position: 100% 40%; }
    }
    .card {
      background: rgba(14, 7, 16, 0.92);
      border-radius: 18px;
      box-shadow: 0 4px 32px 0 #8e003d43;
      padding: 42px 26px 36px 26px;
      max-width: 390px;
      width: 94vw;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.7s cubic-bezier(0.7,0.1,0.3,1);
      border: 1.5px solid #b8002a33;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px);}
      to   { opacity: 1; transform: translateY(0);}
    }
    h1 {
      font-size: 2.25em;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 0.2em;
      color: #f44336;
      letter-spacing: 1px;
      text-shadow: 0 2px 22px #ae002d85, 0 0px 2px #b8002a;
      animation: popIn 1.1s cubic-bezier(0.7,0.1,0.3,1);
    }
    @keyframes popIn {
      0% { transform: scale(0.84);}
      60%{ transform: scale(1.06);}
      100%{ transform: scale(1);}
    }
    p {
      margin-top: 0.8em;
      margin-bottom: 1.4em;
      font-size: 1em;
      color: #fee;
      line-height: 1.45;
      letter-spacing: 0.01em;
    }
    .download-btn {
      display: inline-block;
      padding: 15px 38px;
      font-size: 1.1em;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, #b8002a 35%, #f44336 130%);
      border: none;
      border-radius: 100px;
      box-shadow: 0 2px 24px #f4433630;
      cursor: pointer;
      transition: transform 0.13s, box-shadow 0.19s, background 0.19s;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      outline: none;
      font-family: inherit;
      margin-top: 12px;
      margin-bottom: 16px;
      animation: btnIn 1.2s cubic-bezier(0.8,0.1,0.2,1);
      border: 1.5px solid #b8002a;
    }
    @keyframes btnIn {
      from { opacity: 0; transform: scale(0.88);}
      to   { opacity: 1; transform: scale(1);}
    }
    .download-btn:hover, .download-btn:focus {
      transform: scale(1.075);
      background: linear-gradient(90deg, #f44336 40%, #b8002a 120%);
      box-shadow: 0 10px 36px #b8002a55;
    }
    .subtle {
      font-size: 1em;
      color: #fc1a4a;
      margin-top: 0.5em;
      margin-bottom: 1.5em;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-shadow: 0 0 10px #f4433629;
    }
    footer {
      font-size: 0.89em;
      color: #ee7c99;
      margin-top: 32px;
      margin-bottom: -12px;
      letter-spacing: 0.15px;
      text-align: center;
      opacity: 0.95;
    }
    @media (max-width: 550px) {
      .card {
        padding: 26px 5vw;
        max-width: 97vw;
      }
      h1 { font-size: 1.38em; }
      .download-btn { font-size: 1em; padding: 12px 12vw;}
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>5 Night's at Konczal's</h1>
    
    <p>
      <b>Atmosfera grozy, wyzwania i Konczal</b> w najciemniejszym wydaniu.<br>
      Sprawdź, czy podołasz temu zadaniu!
    </p>
    <a 
      class="download-btn" 
      href="https://files.catbox.moe/tw44c0.zip" 
      download
    >
      ↓ Pobierz grę (ZIP)
    </a>
    <footer>
      &copy; 2025 | Five Night's At Konczal's
    </footer>
  </div>
</body>
</html>
